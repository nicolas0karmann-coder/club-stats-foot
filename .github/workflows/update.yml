name: Mise à jour des stats

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 heures
  workflow_dispatch:          # lancement manuel possible

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collecte des données
        run: node scripts/update.mjs
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
      - name: Détails des derniers matchs et Süper Lig (ESPN)
        if: always()
        run: node scripts/enrich-espn.mjs
        continue-on-error: true
      - name: Enregistrement
        if: always()
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour des données"
            git pull --rebase
            git push
          fi
