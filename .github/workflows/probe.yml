name: Test des sources gratuites (sonde)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sonde ESPN
        run: node scripts/probe-espn.mjs
      - name: Enregistrement des extraits
        if: always()
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data/probe
          if ! git diff --cached --quiet; then
            git commit -m "Extraits de la sonde ESPN"
            git pull --rebase
            git push
          fi
